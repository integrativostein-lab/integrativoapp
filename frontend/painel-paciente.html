<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/x-icon" href="img/favicons/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Painel — Integrativo.App</title>
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    .btn-teleconsulta { background: var(--verde-destaque); color: #FFF; padding: 8px 14px; border-radius: 20px; font-size: 12px; text-decoration: none; border: 0; cursor: pointer; font-weight: 700; }
    .teleconsulta-panel { display: none; margin-top: 24px; background: var(--branco); border-radius: var(--raio-padrao); box-shadow: var(--sombra-suave); overflow: hidden; }
    .teleconsulta-panel.ativo { display: block; }
    .teleconsulta-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E2E8F0; }
    .teleconsulta-frame { width: 100%; height: 720px; border: 0; background: #F8FAFC; display: block; }
    .btn-fechar-teleconsulta { background: #DC2626; color: #FFF; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="painel">
    <div class="painel-sidebar">
      <h3>🌿 Integrativo.App</h3>
      <nav>
        <a href="#" class="ativo">📅 Meus Agendamentos</a>
        <a href="busca.html">🔍 Buscar Profissionais</a>
        <a href="anamnese-paciente.html">🧾 Anamnese pré-consulta</a>
        <a href="painel-privacidade.html">🔒 Meus Dados (LGPD)</a>
        <a href="manual.html">📖 Manual</a>
        <a href="#" onclick="logout()">🚪 Sair</a>
      </nav>
    </div>
    <div class="painel-conteudo">
      <h2>Meus Agendamentos</h2>

      <div class="teleconsulta-panel" id="teleconsulta-panel" aria-live="polite">
        <div class="teleconsulta-header">
          <div>
            <h3 style="margin:0;color:var(--azul-profundo);">Teleconsulta</h3>
            <p id="teleconsulta-info" style="margin:4px 0 0;font-size:12px;color:var(--texto-suave);">Sala aberta aqui no painel.</p>
          </div>
          <button type="button" class="btn-fechar-teleconsulta" onclick="fecharTeleconsulta()">Fechar sala</button>
        </div>
        <iframe id="teleconsulta-frame" class="teleconsulta-frame" title="Sala de teleconsulta" loading="lazy"></iframe>
      </div>

      <div id="lista-agendamentos" style="margin-top:20px;"></div>
    </div>
  </div>

  <script src="js/catalogo-terapeutico.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }

    function podeEntrarTeleconsulta(a) {
      return a.modalidade === 'online' && ['agendado', 'em_andamento', 'reagendado'].includes(a.status);
    }

    function iniciarTeleconsulta(id) {
      var sala = 'teleconsulta-' + id;
      var frame = document.getElementById('teleconsulta-frame');
      var panel = document.getElementById('teleconsulta-panel');
      document.getElementById('teleconsulta-info').textContent = 'Sala: ' + sala + ' · aguardando o profissional na mesma sala.';
      frame.src = 'reuniao.html?agendamento_id=' + encodeURIComponent(id) + '&embed=1';
      panel.classList.add('ativo');
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function fecharTeleconsulta() {
      var frame = document.getElementById('teleconsulta-frame');
      frame.src = 'about:blank';
      document.getElementById('teleconsulta-panel').classList.remove('ativo');
    }

    async function carregar() {
      var token = localStorage.getItem('integra_token');
      if (!token) { window.location.href = 'login.html'; return; }

      var r = await fetch(`${CONFIG.API_URL}/agendamentos/meus`, { headers: { 'Authorization': `Bearer ${token}` } });
      var dados = await r.json();
      var div = document.getElementById('lista-agendamentos');

      if (!Array.isArray(dados) || dados.length === 0) {
        div.innerHTML = '<p style="color:var(--texto-medio);">Nenhum agendamento encontrado. <a href="busca.html">Buscar profissionais</a></p>';
        return;
      }

      div.innerHTML = dados.map(function(a) {
        var acoes = '';
        if (a.status === 'agendado' || a.status === 'reagendado') {
          acoes += '<button class="btn btn-primario" style="font-size:12px;padding:6px 12px;background:var(--vermelho);border:0;" onclick="cancelar(' + a.id + ')">Cancelar</button>';
          acoes += '<button class="btn btn-outline" style="font-size:12px;padding:6px 12px;" onclick="remarcar(' + a.id + ')">Remarcar</button>';
        }
        if (podeEntrarTeleconsulta(a)) {
          acoes += '<button class="btn-teleconsulta" onclick="iniciarTeleconsulta(' + a.id + ')">🎥 Entrar na consulta</button>';
        }

        return `
        <div style="background:var(--branco);padding:18px;border-radius:var(--raio-borda);box-shadow:var(--sombra);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div>
            <strong>${a.data_agendamento}</strong> às ${a.horario_inicio} — ${a.modalidade}<br>
            <span style="font-size:13px;color:var(--texto-medio);">Profissional: ${a.profissional_nome || 'N/A'} | Status: ${a.status} | R$ ${a.valor}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">${acoes}</div>
        </div>`;
      }).join('');
    }

    async function cancelar(id) {
      if (!confirm('Deseja cancelar este agendamento?')) return;
      var token = localStorage.getItem('integra_token');
      await fetch(`${CONFIG.API_URL}/agendamentos/${id}/cancelar`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
      carregar();
    }

    async function remarcar(id) {
      var novaData = prompt('Nova data (AAAA-MM-DD):');
      if (!novaData) return;
      var novoHorario = prompt('Novo horário (HH:MM):');
      if (!novoHorario) return;
      var token = localStorage.getItem('integra_token');
      await fetch(`${CONFIG.API_URL}/agendamentos/${id}/remarcar`, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ data_agendamento: novaData, horario_inicio: novoHorario }) });
      carregar();
    }

    carregar();
  </script>
<footer style='text-align:center; padding:30px 20px; font-size:12px; color:var(--texto-medio); border-top:1px solid #E2E8F0; margin-top:40px; line-height:1.6;'>&copy; 2026 Integrativo.App&reg; &bull; Todos os direitos reservados.<br>Desenvolvido por Integrativo.App &bull; CPF: 089.106.448-69</footer>
</body>
</html>
